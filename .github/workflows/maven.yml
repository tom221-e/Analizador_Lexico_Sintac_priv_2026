name: Java CI with Maven

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*' # Esto activa el workflow cuando creas un tag como v1.0
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Permite correrlo manualmente desde la web

permissions:
  contents: write # FUNDAMENTAL: Da permiso para crear la Release y subir el JAR

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Configurar JDK
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Compilar con Maven
      run: mvn -B clean install --file pom.xml

    - name: Subir Artefacto a GitHub Actions
      uses: actions/upload-artifact@v4
      with:
        name: analizador-jar
        path: target/*.jar

    - name: Crear Release y Subir JAR
      uses: softprops/action-gh-release@v2
      # Solo se ejecuta si el evento es un TAG que empieza con 'v'
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: target/*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
